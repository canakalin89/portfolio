<!DOCTYPE html>
<html lang="tr" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Can Akalın | Portfolio</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', sans-serif;
        background:
          radial-gradient(circle at 18% 0%, rgba(20, 184, 166, 0.18), transparent 28rem),
          radial-gradient(circle at 90% 8%, rgba(244, 114, 182, 0.13), transparent 26rem),
          #0b1220;
        color: #f8fafc;
        margin: 0;
        overflow-x: hidden;
      }

      a {
        color: inherit;
      }

      .eyebrow,
      .project-subtitle,
      .section-heading {
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .eyebrow {
        color: #5eead4;
        font-size: 12px;
        font-weight: 700;
      }

      .hero-note {
        border-left: 1px solid rgba(94, 234, 212, 0.55);
        color: #cbd5e1;
        font-size: 15px;
        line-height: 1.8;
        max-width: 34rem;
        padding-left: 1.5rem;
      }

      .section-heading {
        align-items: center;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        color: #94a3b8;
        display: flex;
        font-size: 12px;
        font-weight: 700;
        justify-content: space-between;
        padding-bottom: 1rem;
      }

      .project-card {
        animation: rise 0.55s ease both;
        background: linear-gradient(145deg, rgba(15, 23, 42, 0.96), rgba(17, 24, 39, 0.82));
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 8px;
        min-height: 24rem;
        padding: 1.75rem;
        transition: border-color 0.2s ease, transform 0.2s ease, background 0.2s ease;
      }

      .project-card:hover {
        background: linear-gradient(145deg, rgba(20, 184, 166, 0.13), rgba(17, 24, 39, 0.92));
        border-color: rgba(94, 234, 212, 0.55);
        transform: translateY(-3px);
      }

      .project-icon {
        align-items: center;
        background: #5eead4;
        color: #042f2e;
        display: inline-flex;
        height: 2.75rem;
        justify-content: center;
        width: 2.75rem;
      }

      .project-number {
        color: rgba(148, 163, 184, 0.42);
        font-size: 3rem;
        font-weight: 700;
        line-height: 1;
      }

      .project-subtitle {
        color: #5eead4;
        font-size: 11px;
        font-weight: 700;
      }

      .btn-primary {
        align-items: center;
        background: #f8fafc;
        color: #0f172a;
        display: inline-flex;
        font-size: 13px;
        font-weight: 700;
        gap: 8px;
        min-height: 42px;
        padding: 0 16px;
        text-decoration: none;
        transition: background 0.2s ease, transform 0.2s ease;
      }

      .btn-primary:hover {
        background: #5eead4;
        transform: translateY(-1px);
      }

      .btn-ghost {
        align-items: center;
        border: 1px solid rgba(148, 163, 184, 0.34);
        color: #cbd5e1;
        display: inline-flex;
        font-size: 13px;
        font-weight: 700;
        gap: 8px;
        min-height: 42px;
        padding: 0 15px;
        text-decoration: none;
        transition: border-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
      }

      .btn-ghost:hover {
        border-color: #5eead4;
        color: #5eead4;
        transform: translateY(-1px);
      }

      .icon-link {
        align-items: center;
        border: 1px solid rgba(148, 163, 184, 0.28);
        color: #cbd5e1;
        display: inline-flex;
        height: 2.5rem;
        justify-content: center;
        text-decoration: none;
        transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
        width: 2.5rem;
      }

      .icon-link:hover {
        background: rgba(94, 234, 212, 0.09);
        border-color: #5eead4;
        color: #5eead4;
      }

      .tag {
        background: rgba(94, 234, 212, 0.1);
        border: 1px solid rgba(94, 234, 212, 0.18);
        color: #99f6e4;
        font-size: 11px;
        font-weight: 700;
        padding: 5px 10px;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(12px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 640px) {
        .hero-note {
          padding-left: 1rem;
        }

        .project-card {
          min-height: auto;
          padding: 1.25rem;
        }
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react/": "https://esm.sh/react@^19.2.4/",
        "react": "https://esm.sh/react@^19.2.4",
        "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
