<!DOCTYPE html>
<html lang="tr" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Can Akalın | Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8fafc;
        color: #0f172a;
        margin: 0;
        overflow-x: hidden;
      }

      .accent-text {
        color: #4f46e5;
      }

      .card {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 20px;
        transition: box-shadow 0.3s ease, transform 0.3s ease;
      }

      .card:hover {
        box-shadow: 0 12px 40px rgba(79, 70, 229, 0.1);
        transform: translateY(-4px);
      }

      .tag {
        background: #eef2ff;
        color: #4f46e5;
        border-radius: 99px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.05em;
        padding: 4px 12px;
      }

      .btn-primary {
        background: #4f46e5;
        color: white;
        border-radius: 12px;
        padding: 12px 24px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.02em;
        transition: background 0.2s ease;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .btn-primary:hover {
        background: #4338ca;
      }

      .btn-ghost {
        color: #64748b;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 11px 20px;
        font-size: 13px;
        font-weight: 500;
        transition: all 0.2s ease;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: white;
      }

      .btn-ghost:hover {
        border-color: #4f46e5;
        color: #4f46e5;
      }

      .icon-wrap {
        background: #eef2ff;
        border-radius: 14px;
        padding: 14px;
        display: inline-flex;
        color: #4f46e5;
      }

      .divider {
        height: 1px;
        background: #e2e8f0;
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react/": "https://esm.sh/react@^19.2.4/",
        "react": "https://esm.sh/react@^19.2.4",
        "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
      }
    }
    </script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
